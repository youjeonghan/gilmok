<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>길목 아이콘 후보</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    background: #2A2D31; color: #E9E7E2;
    padding: 40px 32px 56px;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  p.sub { font-size: 13px; color: #9BA0A6; margin-bottom: 28px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px; max-width: 960px;
  }
  .card {
    background: #33373C; border-radius: 16px; padding: 22px 20px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .card svg { display: block; }
  .main-icon svg { width: 128px; height: 128px; border-radius: 29px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .small-row { display: flex; align-items: flex-end; gap: 14px; }
  .small-row svg { border-radius: 6px; }
  .s56 svg { width: 56px; height: 56px; border-radius: 13px; }
  .s28 svg { width: 28px; height: 28px; }
  .label { text-align: center; }
  .label b { display: block; font-size: 14px; margin-bottom: 3px; }
  .label span { font-size: 12px; color: #9BA0A6; }
  .num {
    display: inline-block; background: #E8563C; color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 999px; padding: 1px 8px; margin-bottom: 6px;
  }
</style>
</head>
<body>
<h1>길목 — 앱 아이콘 후보 6종</h1>
<p class="sub">하비팅 아이콘과 같은 문법(단색 배경 + 굵은 라운드 글리프) · 각 카드 아래는 56px / 28px 축소 테스트</p>
<div class="grid">

  <div class="card">
    <span class="num">1</span>

    <div class="small-row">
      <span class="s56"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#20282A"/><g fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"><path d="M256 408 V264"/><path d="M168 172 L256 264 L344 172"/></g><circle cx="256" cy="264" r="36" fill="#E8563C"/></svg></span>
      <span class="s28"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#20282A"/><g fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"><path d="M256 408 V264"/><path d="M168 172 L256 264 L344 172"/></g><circle cx="256" cy="264" r="36" fill="#E8563C"/></svg></span>
    </div>
    <div class="label"><b>갈림길 Y</b><span>다크 차콜 · 길목 지점에 오렌지 점</span></div>
  </div>

  <div class="card">
    <span class="num">2</span>
    <div class="main-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#20282A"/><g fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"><path d="M160 146 V196 Q160 224 188 224 H276"/><path d="M160 196 V324 Q160 352 188 352 H276"/></g><circle cx="160" cy="146" r="28" fill="#E8563C"/><rect x="288" y="186" width="96" height="76" rx="16" fill="#FFFFFF"/><rect x="306" y="204" width="44" height="12" rx="6" fill="#20282A"/><rect x="306" y="224" width="60" height="8" rx="4" fill="#20282A" opacity="0.45"/><rect x="288" y="314" width="96" height="76" rx="16" fill="#FFFFFF"/><rect x="306" y="332" width="44" height="12" rx="6" fill="#20282A"/><rect x="306" y="352" width="60" height="8" rx="4" fill="#20282A" opacity="0.45"/></svg></div>

    <div class="label"><b>플로우 맵</b><span>트렁크·분기·씬 카드 — 앱 화면 언어 그대로</span></div>
  </div>

  <div class="card">
    <span class="num">3</span>
    <div class="main-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#20282A"/><path d="M148 172 H308 Q360 172 360 224 V372" fill="none" stroke="#FFFFFF" stroke-width="104" stroke-linecap="round"/><path d="M148 172 H308 Q360 172 360 224 V372" fill="none" stroke="#E8563C" stroke-width="14" stroke-linecap="round" stroke-dasharray="26 34"/></svg></div>

    </div>
    <div class="label"><b>길 ㄱ</b><span>'길목'의 ㄱ을 도로로 — 오렌지 중앙선</span></div>

      <span class="s28"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#20282A"/><g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"><path d="M164 256 H212 Q240 256 240 228 V212 Q240 184 268 184 H332"/><path d="M164 256 H212 Q240 256 240 284 V300 Q240 328 268 328 H332"/></g><circle cx="156" cy="256" r="42" fill="#E8563C"/><circle cx="348" cy="184" r="30" fill="#FFFFFF"/><circle cx="348" cy="328" r="30" fill="#FFFFFF"/></svg></span>

  <div class="card">
    <span class="num">5</span>
    <div class="main-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#1F6E63"/><g fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"><path d="M256 408 V264"/><path d="M168 172 L256 264 L344 172"/></g><circle cx="256" cy="264" r="36" fill="#20282A"/></svg></div>
    <div class="small-row">

    <div class="small-row">
      <span class="s56"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#F4F1EA"/><g fill="none" stroke="#20282A" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"><path d="M256 408 V264"/><path d="M168 172 L256 264 L344 172"/></g><circle cx="256" cy="264" r="36" fill="#E8563C"/></svg></span>
      <span class="s28"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#F4F1EA"/><g fill="none" stroke="#20282A" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"><path d="M256 408 V264"/><path d="M168 172 L256 264 L344 172"/></g><circle cx="256" cy="264" r="36" fill="#E8563C"/></svg></span>

</div>

</html>
